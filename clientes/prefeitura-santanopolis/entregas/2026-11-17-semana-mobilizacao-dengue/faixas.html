<!-- Faixas institucionais (topo + rodapé) sobre o vídeo. Fundo transparente. -->
<style>*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;position:relative}

.topo img{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:440px}
.rod{position:absolute;left:0;right:0;bottom:0;height:380px;

.k{font:600 30px Inter,sans-serif;letter-spacing:.2em;color:#E7EEF8}
.g{font:800 86px/1 "Exo 2",sans-serif;letter-spacing:.01em;margin-top:12px}

</style>
<div class="topo"><img src="../../identidade/logo-prefeitura-branco.png" alt=""></div>
