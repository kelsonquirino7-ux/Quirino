<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1080x1350"><link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Card açougue Itamar (1080x1350), fundo vermelho + selo 3D "Semana das Carnes" (desenho próprio, SVG editável).
     Produtos: troque foto/nome/preço em cada .p. Foto do miolo do selo: <image href> dentro do svg. -->
<style>
:root{--amarelo:#FFD302;--vermelho:#FF291E;--marrom:#280E01}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;font-family:"Baloo 2",sans-serif;color:var(--marrom);display:flex;flex-direction:column;padding:0 40px 24px;gap:14px;overflow:hidden;
 background:radial-gradient(circle at 74% 18%,rgba(255,211,2,.35) 0,transparent 330px),repeating-conic-gradient(from 0deg at 74% 18%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 14deg),radial-gradient(ellipse at 50% 30%,#FF3B24 0,#E01A00 45%,#8E0A00 100%)}
.top{position:relative;height:410px;flex:none;z-index:2}
.top .logo{position:absolute;left:-6px;top:34px;width:440px;filter:drop-shadow(0 10px 14px rgba(40,14,1,.45))}
.top .selo{position:absolute;right:0;top:22px;height:372px;z-index:5;filter:drop-shadow(0 0 20px rgba(255,211,2,.5)) drop-shadow(0 14px 14px rgba(40,14,1,.5))}
.titulo{position:absolute;left:4px;top:248px;font:800 112px/0.85 "Baloo 2";color:var(--amarelo);text-shadow:0 6px 0 #7A0800,0 12px 18px rgba(40,14,1,.4)}
.titulo span{display:block;font-size:52px;color:#fff;letter-spacing:1px;margin-bottom:6px}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:16px}
.p{background:#fff;border-radius:24px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 7px 0 #7A0800;min-height:0}
.foto{width:46%;height:100%;background:center/contain no-repeat;filter:drop-shadow(0 6px 6px rgba(40,14,1,.25))}
.foto.vazio{background:repeating-linear-gradient(45deg,#F4F0E6 0 14px,#ECE6D8 14px 28px);border-radius:16px;display:grid;place-items:center;font:600 26px "Baloo 2";color:#9A8C70;filter:none}
.info{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.nome{font:700 27px/1.05 "Baloo 2"}
.preco{background:var(--vermelho);color:#fff;border-radius:14px;padding:4px 14px 0;font:800 50px/1.05 "Baloo 2";white-space:nowrap;box-shadow:0 5px 0 #7A0800}
.preco small{font-size:24px;margin-right:4px}
.preco span{font-size:24px;margin-left:2px}
.rod{text-align:center;font:600 22px/1.3 "Baloo 2";color:#fff}
.arroba{font:800 30px "Baloo 2";color:var(--amarelo)}
</style>
<div class="top"><img class="logo" src="../../identidade/logo-itamar-3d-transparente.png" alt="">
<div class="titulo"><span>SEMANA DAS</span>CARNES</div>
<img class="selo" src="../../identidade/selos/ofertas-do-acougue-previa-designi.png" alt=""></div>
<div class="grid">
<div class="p"><div class="foto" style="background-image:url(../../fotos/produtos/acougue/cruz-machado-com-osso.png)"></div><div class="info"><div class="nome">Cruz machado com osso</div><div class="preco"><small>R$</small>29,90<span>/kg</span></div></div></div>
<div class="p"><div class="foto" style="background-image:url(../../fotos/produtos/acougue/bisteca-suina.png)"></div><div class="info"><div class="nome">Bisteca suína resfriada</div><div class="preco"><small>R$</small>16,99<span>/kg</span></div></div></div>
<div class="p"><div class="foto" style="background-image:url(../../fotos/produtos/acougue/figado-bovino.png)"></div><div class="info"><div class="nome">Fígado bovino</div><div class="preco"><small>R$</small>17,90<span>/kg</span></div></div></div>
<div class="p"><div class="foto" style="background-image:url(../../fotos/produtos/acougue/charque-traseiro.png)"></div><div class="info"><div class="nome">Charque traseiro</div><div class="preco"><small>R$</small>39,90<span>/kg</span></div></div></div>
<div class="p"><div class="foto" style="background-image:url(../../fotos/produtos/acougue/frango-gujao-congelado.png)"></div><div class="info"><div class="nome">Frango Gujão congelado</div><div class="preco"><small>R$</small>9,90<span>/kg</span></div></div></div>
<div class="p"><div class="foto" style="background-image:url(../../fotos/produtos/acougue/ovos-brancos-30un.png)"></div><div class="info"><div class="nome">Ovos brancos extra 30&nbsp;un.</div><div class="preco"><small>R$</small>15,90<span></span></div></div></div>
</div>
<p class="rod">Ofertas válidas enquanto durarem os estoques. Imagens ilustrativas.<br><b class="arroba">@itamarsupermercado</b></p>
