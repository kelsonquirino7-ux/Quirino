<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1080x1350"><link rel="stylesheet" href="../../../ferramentas/fontes.css">
<!-- Modelo: card de comunicado da Prefeitura (1080x1350, feed Instagram).
     Troque os textos entre colchetes. Regra: sem nome/foto de autoridade (CF art. 37 §1º). -->
<style>
:root{--azul:#002F67;--azul2:#1D4F8F;--tinta:#E7EEF8;--txt:#13223D}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:#fff;font-family:Inter,sans-serif;color:var(--txt);display:flex;flex-direction:column}
header{padding:64px 72px 40px;border-bottom:10px solid var(--azul)}
header img{height:118px}
main{flex:1;padding:64px 72px;display:flex;flex-direction:column;gap:36px}
.tag{align-self:flex-start;background:var(--azul);color:#fff;font:800 30px/1 "Exo 2";letter-spacing:.12em;padding:16px 26px;border-radius:8px}
h1{font:800 92px/1.02 "Exo 2";color:var(--azul);letter-spacing:-.01em}
p{font-size:36px;line-height:1.4}
.info{margin-top:auto;background:var(--tinta);border-radius:16px;padding:32px 40px;display:grid;gap:18px}
.info div{display:grid;grid-template-columns:200px 1fr;font-size:32px}
.info b{font:700 26px "Exo 2";letter-spacing:.1em;color:var(--azul2);text-transform:uppercase;align-self:center}
footer{background:var(--azul);color:#fff;padding:30px 72px;display:flex;justify-content:space-between;font:500 28px "Exo 2";letter-spacing:.04em}
</style>
<header><img src="../identidade/logo-prefeitura-azul-transparente.png" alt=""></header>
<main>
  <span class="tag">COMUNICADO</span>
  <h1>[Título curto do comunicado]</h1>
  <p>[Texto explicativo em até 3 linhas: o que é, para quem e o que a pessoa precisa fazer.]</p>
  <section class="info">
    <div><b>Data</b><span>[dd/mm/aaaa]</span></div>
    <div><b>Horário</b><span>[00h00]</span></div>
    <div><b>Local</b><span>[Endereço ou órgão]</span></div>
  </section>
</main>
<footer><span>[site da prefeitura]</span><span>@pmssantanopolis</span></footer>
