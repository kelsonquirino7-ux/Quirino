<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1080x1350"><link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Ref.: card azul com bandeira tremulando (CAU/RJ). Institucional, sem nome/foto de autoridade (CF art. 37 §1º). -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:"Exo 2",sans-serif;color:#fff;
 background:radial-gradient(120% 80% at 70% 15%,#1D4F8F 0%,#0B3B78 40%,#002F67 75%,#00224C 100%)}
body::before{content:"";position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;
 background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 3px)}
.topo{position:absolute;top:84px;left:0;right:0;text-align:center}
.data{font:500 32px "Exo 2";letter-spacing:.42em;padding-left:.42em;color:#DCE7F5}
h1{margin-top:34px;font:800 84px/1.04 "Exo 2";letter-spacing:-.01em;text-shadow:0 6px 24px rgba(0,20,50,.45)}
h1 .rep{display:block;font-size:156px;line-height:1;margin-top:6px;color:#FFDF00}
.flag{position:absolute;left:40px;top:420px;width:960px;filter:drop-shadow(0 30px 40px rgba(0,15,40,.55))}
footer{position:absolute;bottom:56px;right:72px;display:flex}
footer img{height:82px}
</style>
<div class="topo"><div class="data">15 DE NOVEMBRO</div>
<h1>Dia da<br>Proclamação da<span class="rep">República</span></h1></div>
<img class="flag" src="bandeira.png" alt="">
<footer><img src="../../identidade/logo-prefeitura-branco.png" alt=""></footer>
