<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1080x1350"><link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Ref.: Designi — fundo amarelo com cena histórica desbotada, "REPÚBLICA" serifado em eco, quadro verde 3D com losango e esfera,
     balões 3D com coração azul, (cena antiga: Magnific / Nano Banana 2.1, ilustrativa) fitas desfocadas nos cantos, "Proclamação da" manuscrito sobre "REPÚBLICA". -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:"Playfair Display",serif;
 background:radial-gradient(90% 70% at 50% 45%,#FFC81A 0%,#FFBE0B 55%,#F7A800 100%)}
#cena{position:absolute;left:-40px;top:0;width:1160px;height:647px;object-fit:cover;mix-blend-mode:multiply;opacity:.24;filter:sepia(.6) blur(1.6px);-webkit-mask:linear-gradient(180deg,#000 60%,transparent 100%)}
.raios{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 26px,rgba(255,255,255,0) 26px 70px);
 -webkit-mask:radial-gradient(70% 60% at 80% 80%,#000,transparent)}
.eco{position:absolute;left:0;right:0;top:252px;text-align:center;font:400 112px/135px "Playfair Display";letter-spacing:-.005em}
.eco div:nth-child(1){color:#FFF200}
.eco div:nth-child(2){color:rgba(255,242,0,.78)}
.eco div:nth-child(3){color:rgba(255,242,0,.5)}
.eco div:nth-child(4){color:rgba(255,242,0,.28)}
.quadro{position:absolute;left:390px;top:338px;width:300px;height:452px;border-radius:30px;overflow:hidden;
 background:linear-gradient(160deg,#2DB84A 0%,#139A31 35%,#0C7E26 70%,#0A6B20 100%);
 box-shadow:0 34px 46px rgba(140,70,0,.45),0 6px 0 #075A18,inset 0 2px 0 rgba(255,255,255,.55),inset 0 -6px 14px rgba(0,40,10,.45)}
.quadro::after{content:"";position:absolute;inset:0;border-radius:30px;background:linear-gradient(115deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 72%,rgba(255,255,255,.12) 100%)}
.losango{position:absolute;left:22px;top:30px;width:256px;height:112px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
 background:linear-gradient(180deg,#FFE45A 0%,#FFC400 52%,#E09A00 100%)}
.losango2{position:absolute;left:22px;top:36px;width:256px;height:112px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#B87A00}
.esfera{position:absolute;left:96px;top:24px;width:108px;height:108px;border-radius:50%;
 background:radial-gradient(circle at 38% 30%,#9FD3FF 0%,#2E8BFF 22%,#0B4FD6 58%,#06308F 100%);box-shadow:0 10px 14px rgba(0,30,90,.45)}
.esfera::after{content:"";position:absolute;left:26px;top:14px;width:40px;height:22px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(4px)}
.ano{position:absolute;left:0;right:0;top:190px;text-align:center;color:#FFE45A;text-shadow:0 3px 0 #0A5A1A,0 8px 18px rgba(0,30,10,.5)}
.ano small{display:block;font:600 22px/1 Montserrat;letter-spacing:.32em;padding-left:.32em;color:#E7F7EA;text-shadow:none}
.ano b{display:block;font:700 108px/1 "Playfair Display";margin-top:16px}
.ano i{display:block;font:400 26px/1.2 "Playfair Display";font-style:italic;color:#E7F7EA;margin-top:12px;text-shadow:none}
.balao{position:absolute;border-radius:34px;background:linear-gradient(150deg,#FFE680 0%,#FFCB1F 45%,#F2A900 100%);
 box-shadow:0 26px 36px rgba(140,70,0,.38),inset 0 4px 0 rgba(255,255,255,.65),inset 0 -8px 14px rgba(170,90,0,.35);display:grid;place-items:center}
.balao::after{content:"";position:absolute;left:30px;bottom:-30px;width:46px;height:46px;background:#F4B000;clip-path:polygon(0 0,100% 0,10% 100%)}
.balao i{width:110px;height:100px;background:radial-gradient(circle at 34% 28%,#9FD0FF 0%,#2F86FF 25%,#0B47D0 62%,#062E8A 100%);
 clip-path:path('M55 98 C14 66 0 48 0 28 C0 12 13 0 29 0 C41 0 50 7 55 17 C60 7 69 0 81 0 C97 0 110 12 110 28 C110 48 96 66 55 98Z');filter:drop-shadow(0 6px 6px rgba(0,30,90,.4))}
.b1{left:26px;top:560px;width:236px;height:190px;transform:rotate(-8deg);filter:blur(1.6px)}
.b2{left:866px;top:328px;width:146px;height:118px;transform:rotate(6deg) ;filter:blur(1.2px)}
.b2 i{transform:scale(.62)}
.fita{position:absolute;width:300px;height:900px;filter:blur(14px);
 background:linear-gradient(90deg,#F28A00 0 14%,#FFD400 14% 34%,#0E8F33 34% 58%,#FFD400 58% 74%,#0E8F33 74% 100%)}
.f1{left:-60px;top:900px;transform:rotate(-28deg);border-radius:150px}
.f2{right:-60px;top:900px;transform:rotate(28deg) scaleX(-1);border-radius:150px}
.titulo{position:absolute;left:0;right:0;top:850px;text-align:center}
.rep{font:400 112px/1 "Playfair Display";color:#fff;letter-spacing:-.005em;text-shadow:0 4px 16px rgba(150,70,0,.35)}
.proc{position:absolute;left:0;right:0;top:4px;font:400 84px/1 "Great Vibes";color:#0B5B1E}
.data{margin-top:30px;font:600 25px Montserrat;letter-spacing:.22em;padding-left:.22em;color:#2B3A12}
.logo{position:absolute;left:50%;transform:translateX(-50%);top:1170px;height:132px;filter:drop-shadow(0 8px 12px rgba(140,70,0,.35))}
</style>
<img id="cena" src="fundo-antigo-ia.png" alt="">
<div class="raios"></div>
<div class="eco"><div>REPÚBLICA</div><div>REPÚBLICA</div><div>REPÚBLICA</div><div>REPÚBLICA</div></div>
<div class="fita f1"></div><div class="fita f2"></div>
<div class="quadro">
  <div class="losango2"></div><div class="losango"></div><div class="esfera"></div>
  <div class="ano"><small>BRASIL</small><b>1889</b><i>Ordem e Progresso</i></div>
</div>
<div class="balao b1"><i></i></div><div class="balao b2"><i></i></div>
<div class="titulo"><div class="rep">REPÚBLICA</div><div class="proc">Proclamação da</div><div class="data">15 de Novembro</div></div>
<img class="logo" src="../../identidade/logo-itamar-3d-transparente.png" alt="">
