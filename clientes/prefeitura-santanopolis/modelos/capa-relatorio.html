<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1240x1754"><link rel="stylesheet" href="../../../ferramentas/fontes.css">
<!-- Modelo: capa de relatório A4 (1240x1754 = A4 a 150 dpi). -->
<style>

body{width:1240px;height:1754px;background:#002F67;color:#fff;font-family:Inter,sans-serif;display:flex;flex-direction:column;padding:110px 100px 90px;position:relative;overflow:hidden}
