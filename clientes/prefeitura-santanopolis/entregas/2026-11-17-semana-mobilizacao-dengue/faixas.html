<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1080x1920">
<link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Sobreposição: logo no topo, sombra suave (só para leitura do texto) e linha branca no rodapé. Fundo transparente. -->
<style>*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;position:relative}
.st{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0))}
.sb{position:absolute;left:0;right:0;bottom:0;height:720px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.30) 45%,rgba(0,0,0,.58))}
img{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:400px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
.l{position:absolute;left:0;right:0;bottom:0;height:16px;background:#fff}
.b{position:absolute;left:0;bottom:0;width:58%;height:16px;background:#002F67}
</style>
<div class="st"></div><div class="sb"></div><img src="../../identidade/logo-prefeitura-branco.png" alt=""><div class="l"></div><div class="b"></div>
