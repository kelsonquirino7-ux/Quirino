<!doctype html><meta charset="utf-8"><meta name="tamanho" content="2710x1730"><link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Backdrop Itamar Supermercado · versão "virada de página" (a página de 2026 vira e revela o 7) · 2,71 m x 1,73 m (1 unidade = 1 mm).
     Inspirado na referência referencias/ref-ano-novo-virada-de-pagina.jpg, nas cores do Itamar. Gerar: node render.js -->
<style>
@page{size:2710mm 1730mm;margin:0}
*{margin:0}html,body{background:#FFD302}
svg{display:block;width:2710px;height:1730px}
@media print{svg{width:2710mm;height:1730mm}}
text{font-family:"Baloo 2",sans-serif;font-weight:800}
</style>
<svg id="s" viewBox="0 0 2710 1730" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="fundo" gradientUnits="userSpaceOnUse" cx="2250" cy="900" r="1500"><stop offset="0" stop-color="#FFE65C"/><stop offset=".5" stop-color="#FFD302"/><stop offset="1" stop-color="#F0B400"/></radialGradient>
  <radialGradient id="pagina" gradientUnits="userSpaceOnUse" cx="1000" cy="650" r="1500"><stop offset="0" stop-color="#4A1C08"/><stop offset=".6" stop-color="#280E01"/><stop offset="1" stop-color="#1A0800"/></radialGradient>
  <linearGradient id="dobra" gradientUnits="userSpaceOnUse" x1="1800" y1="700" x2="2350" y2="420"><stop offset="0" stop-color="#C4170F"/><stop offset=".45" stop-color="#FF3A2A"/><stop offset="1" stop-color="#E01B10"/></linearGradient>
  <linearGradient id="amarelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE65C"/><stop offset="1" stop-color="#FFC800"/></linearGradient>
</defs>
<!-- camada de baixo (2027): amarelo -->
<rect width="2710" height="1730" fill="url(#fundo)"/>
<g id="fogosA"></g>
<text x="2000" y="1010" font-size="900" fill="#B3140D" transform="translate(18,18)">7</text>
<text x="2000" y="1010" font-size="900" fill="#280E01">7</text>
<text x="150" y="1560" font-size="112" fill="#280E01">Feliz Natal e um 2027 completo,</text>
<text x="150" y="1672" font-size="112" fill="#B3140D">igual ao Itamar.</text>
<image href="../../identidade/logo-itamar-3d-transparente.png" x="1900" y="1265" width="700" height="335"/>

<!-- página de cima (2026 indo embora): marrom -->
<g id="sombraPag"></g>
<path id="pag" d="M0,0 L2710,0 C2670,60 2620,95 2560,110 L1850,300 Q1790,760 1800,1230 C1500,1350 800,1270 0,1440 Z" fill="url(#pagina)"/>
<path d="M2710,0 C2670,60 2620,95 2560,110 M1800,1230 C1500,1350 800,1270 0,1440" fill="none" stroke="#FFF3C4" stroke-width="4" opacity=".7"/>
<g id="fogosB"></g>
<text x="330" y="330" font-size="124" letter-spacing="22" fill="#FFF3C4">FELIZ</text>
<text x="300" y="1010" font-size="900" fill="url(#amarelo)">202</text>
<text x="330" y="1180" font-size="124" letter-spacing="22" fill="#FFF3C4">ANO NOVO</text>

<!-- dobra da página -->
<g id="sombraDobra"></g>
<path id="dob" d="M1850,300 Q2230,235 2560,110 C2120,290 1900,640 1800,1230 Q1790,760 1850,300 Z" fill="url(#dobra)"/>
<path d="M2560,110 C2120,290 1900,640 1800,1230" fill="none" stroke="#FF8A7A" stroke-width="5" opacity=".8"/>
</svg>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const el=(p,n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
// sombras suaves (camadas vetoriais)
for(let i=1;i<=10;i++){el($('sombraPag'),'path',{d:$('pag').getAttribute('d'),fill:'#280E01',opacity:.035,transform:`translate(${i*2},${i*5})`});
  el($('sombraDobra'),'path',{d:$('dob').getAttribute('d'),fill:'#1A0800',opacity:.045,transform:`translate(${i*7},${i*4})`})}
// fogos de traço fino: [grupo, x, y, raio, cor]
const fogo=(g,x,y,R,cor)=>{const n=20;for(let i=0;i<n;i++){const a=2*Math.PI*i/n,l=i%2,r1=R*(l?.22:.4),r2=R*(l?1:.72),cx=Math.cos(a),cy=Math.sin(a);
  el($(g),'line',{x1:x+r1*cx,y1:y+r1*cy,x2:x+r2*cx,y2:y+r2*cy,stroke:cor,'stroke-width':R*.035,'stroke-linecap':'round','stroke-dasharray':l?'none':`${R*.09} ${R*.09}`});
  el($(g),'circle',{cx:x+(r2+R*.1)*cx,cy:y+(r2+R*.1)*cy,r:R*.022,fill:cor})}};
fogo('fogosB',1290,215,150,'#FFF3C4');fogo('fogosB',150,760,120,'#FFD302');fogo('fogosB',1480,1150,85,'#FFF3C4');
fogo('fogosA',2590,330,90,'#FFFFFF');fogo('fogosA',1790,1480,80,'#FFFFFF');fogo('fogosA',2610,1130,75,'#B3140D');
</script>
