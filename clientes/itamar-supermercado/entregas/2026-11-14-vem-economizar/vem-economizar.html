<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Itamar · Vem economizar</title>
<link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<style>
:root{--am:#FFD302;--vm:#FF291E;--mr:#280E01;--eco:#FF291E}
/* --eco = vermelho vivo do Itamar nos ecos do lettering; a linha do meio é marrom */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--am)}
#cena{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:var(--am)}
/* fundo "mercado": prateleiras com produtos ao fundo, ícones de compras flutuando, piso */
#mercado{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;filter:blur(9px) saturate(1.05);transform:scale(1.06)}
.luz{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.45) 0,rgba(255,255,255,0) 55%)}
.prat{position:absolute;left:0;height:var(--ph);will-change:transform}
.prat .tabua{position:absolute;left:0;right:0;bottom:0;height:14px;border-radius:7px;background:rgba(40,14,1,.13)}
.prod{position:absolute;bottom:14px;border-radius:10px 10px 4px 4px}
.prod.garrafa{border-radius:40% 40% 8px 8px / 30% 30% 8px 8px}
.prod.lata{border-radius:12px}
.piso{position:absolute;left:0;right:0;bottom:0;height:24%;
  background:linear-gradient(to bottom,rgba(255,41,30,0),rgba(255,41,30,.16)),
  repeating-linear-gradient(90deg,rgba(40,14,1,.06) 0 3px,transparent 3px 160px)}
.icone{position:absolute;will-change:transform}
.icone svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.vinheta{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,211,2,0) 55%,rgba(255,41,30,.20) 100%)}
#chao{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(40,14,1,.55) 0,rgba(40,14,1,.25) 45%,rgba(40,14,1,0) 72%)}
#av{position:absolute;filter:drop-shadow(16px 18px 0 rgba(40,14,1,.18)) drop-shadow(0 14px 22px rgba(40,14,1,.38))}
#anel{position:absolute;border-radius:50%;border:10px solid var(--vm);opacity:0}
.poeira{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--mr);opacity:0}
/* lettering fiel à referência: fundo liso, frase repetida em 3, a do meio escura, ecos claros, sem contorno */
#letter{position:absolute;inset:0;background:var(--am);clip-path:circle(0 at 50% 50%);isolation:isolate}
.eco{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-family:"Titan One";font-weight:400;
  letter-spacing:0;line-height:1;color:var(--eco);will-change:transform}
.eco.forte{color:var(--mr);z-index:2}
#flash{position:absolute;inset:0;background:var(--vm);clip-path:circle(0 at 50% 50%)}
#logo{position:absolute;left:50%;top:50%;opacity:0}
#logo img{width:100%;display:block;filter:drop-shadow(0 24px 30px rgba(40,14,1,.45))}
#brilho{position:absolute;inset:0;overflow:hidden;
  -webkit-mask:url(../../identidade/logo-itamar-3d-transparente.png) center/100% 100% no-repeat}
#brilho i{position:absolute;top:-20%;height:140%;width:22%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));transform:skewX(-20deg)}
</style></head>
<body><div id="cena">
  <div id="mercado"><img id="bg" alt=""><div class="vinheta"></div></div>
  <div id="chao"></div><div id="anel"></div><div id="poeiras"></div>
  <img id="av" alt="">
  <div id="letter"></div>
  <div id="flash"></div>
  <div id="logo"><img src="../../identidade/logo-itamar-3d-transparente.png" alt="Itamar Supermercado"><div id="brilho"><i id="faixa"></i></div></div>
</div>
<script src="avatar/pes.js"></script>
<script>
// Parâmetros: ?fmt=h (1920x1080, exportado em 4K) ou ?fmt=v (1080x1920)
const P = new URLSearchParams(location.search), V = P.get('fmt') === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const D = document.documentElement.style; D.setProperty('--W', W + 'px'); D.setProperty('--H', H + 'px');
const FPS_AV = 24;                     // quadros do avatar (Seedance)
const T_QUEDA = 0.9, T_CLIP = 10.0;    // queda + clipe do avatar
const T_LET = T_QUEDA + T_CLIP;        // 10,9 s: lettering
const T_LOGO = T_LET + 2.6;            // 13,5 s: logo
const DUR = 16;
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eOut = x => 1 - Math.pow(1 - cl(x), 3), eIn = x => Math.pow(cl(x), 3);
const eBack = x => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const eEl = x => { x = cl(x); return x === 0 || x === 1 ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * 2.0944) + 1; };
let semente = 7; const rnd = () => (semente = (semente * 16807) % 2147483647) / 2147483647;

// ---------- fundo de mercado ----------
// o fundo é o vídeo do corredor gerado no Magnific (fundo/0001.jpg…), tocado mais devagar para cobrir os 16 s
const NBG = 240, bg = $('bg');

// ---------- avatar ----------
// quadros 1280x720 recortados (avatar/0001.png…); pés de cada quadro em avatar/pes.js
let PES = [], NQ = 0;
const AW = V ? 2300 : 1920, AH = AW * 9 / 16;      // na vertical o clipe 16:9 é cortado nas laterais
const AX = (W - AW) / 2, AY = H - AH;              // pés do avatar no rodapé da tela
const av = $('av'); Object.assign(av.style, { width: AW + 'px', height: AH + 'px', left: AX + 'px', top: AY + 'px' });
const poeiras = [];
for (let i = 0; i < 10; i++) { const p = document.createElement('div'); p.className = 'poeira'; $('poeiras').appendChild(p); poeiras.push(p); }

// ---------- lettering (referência enviada pelo dono) ----------
// a frase repetida em linhas coladas que enchem a tela inteira; a do meio em marrom, as outras em laranja
let ROWS = [], PASSO = 0;
function montaLettering() {
  const box = $('letter'), txt = 'VEM ECONOMIZAR';
  const m = document.createElement('div'); m.className = 'eco'; m.textContent = txt;
  Object.assign(m.style, { fontSize: '100px', display: 'inline-block', left: 'auto', right: 'auto' }); box.appendChild(m);
  const larg = m.getBoundingClientRect().width; m.remove();
  const fs = W * .94 / larg * 100; PASSO = fs * .84;
  let N = Math.ceil(H / PASSO) + 2; if (N % 2 === 0) N++;
  const meio = (N - 1) / 2;
  for (let i = 0; i < N; i++) {
    const o = i - meio, e = document.createElement('div'); e.className = 'eco' + (o === 0 ? ' forte' : ''); e.textContent = txt;
    Object.assign(e.style, { fontSize: fs + 'px', top: H / 2 - fs * .52 + 'px', zIndex: 100 - Math.abs(o) });
    box.appendChild(e); ROWS.push({ el: e, o });
  }
}

const LW = V ? 900 : 1300;
Object.assign($('logo').style, { width: LW + 'px', marginLeft: -LW / 2 + 'px', marginTop: -(LW * 711 / 1486) / 2 + 'px' });

function pesEm(i) { const p = PES[cl(i, 0, NQ - 1)]; return p || null; }

window.setT = async t => {
  // fundo de mercado
  const bsrc = `fundo/${String(Math.min(NBG, 1 + Math.floor(t * 24 * 10 / DUR))).padStart(4, '0')}.jpg`;
  if (!bg.src.endsWith(bsrc)) { bg.src = bsrc; await bg.decode().catch(() => {}); }

  // avatar
  let idx = 0, dy = 0, sx = 1, sy = 1;
  if (t < T_QUEDA) {
    const q = t / T_QUEDA;
    if (q < .62) dy = -(H * 1.1) * (1 - eIn(q / .62));              // cai
    else { const k = (q - .62) / .38; dy = -60 * Math.sin(Math.PI * k) * (1 - k); sy = 1 - .12 * Math.sin(Math.PI * cl(k * 2.2)) * (1 - k); sx = 2 - sy; }
  } else idx = Math.floor((t - T_QUEDA) * FPS_AV);
  idx = Math.min(idx, NQ - 1);
  const src = `avatar/${String(idx + 1).padStart(4, '0')}.png`;
  if (!av.src.endsWith(src)) { av.src = src; await av.decode().catch(() => {}); }
  const pe = pesEm(idx);
  const ox = pe ? AX + pe.x * AW : W / 2, oy = pe ? AY + pe.y * AH : AY + AH * .95;
  av.style.transformOrigin = `${(ox - AX)}px ${(oy - AY)}px`;
  av.style.transform = `translateY(${dy}px) scale(${sx},${sy})`;
  // sombra no chão: segue os pés, encolhe quando está no alto
  const alto = cl(-dy / (H * .8)), cw = pe ? pe.w * AW * 1.35 + 60 : 0;
  Object.assign($('chao').style, { width: cw * (1 - .6 * alto) + 'px', height: cw * .16 * (1 - .6 * alto) + 'px',
    left: ox + 'px', top: oy + 'px', transform: 'translate(-50%,-55%)', opacity: pe ? (1 - .7 * alto) : 0 });
  // impacto da queda
  const ti = t - T_QUEDA * .62;
  if (ti > 0 && ti < .7) {
    const k = ti / .7;
    Object.assign($('anel').style, { left: ox + 'px', top: oy + 'px', width: 200 + 900 * eOut(k) + 'px', height: (200 + 900 * eOut(k)) * .22 + 'px', transform: 'translate(-50%,-50%)', opacity: 1 - k });
    poeiras.forEach((p, i) => { const a = Math.PI * (i / 9), r = 60 + 380 * eOut(k);
      Object.assign(p.style, { left: ox + Math.cos(a) * r * (i % 2 ? 1 : -1) + 'px', top: oy - Math.sin(a) * r * .45 - 140 * k * (1 - k) * 4 + 'px', opacity: .5 * (1 - k), transform: `scale(${1 - .5 * k})` }); });
  } else { $('anel').style.opacity = 0; poeiras.forEach(p => p.style.opacity = 0); }

  // lettering: fundo liso abre em círculo; a frase do meio entra com impacto;
  // os ecos saem de trás dela (um sobe, outro desce) e ficam encostados; no fim voltam para trás dela
  const lt = t - T_LET, R = Math.hypot(W, H);
  const fecha = t >= T_LOGO ? eIn((t - T_LOGO) / .35) : 0;
  $('letter').style.clipPath = `circle(${lt > 0 ? R * eOut(lt / .45) : 0}px at 50% 50%)`;
  ROWS.forEach(r => {
    const d = Math.abs(r.o);
    if (r.o === 0) {
      const k = (lt - .2) / .4;
      r.el.style.opacity = k > 0 ? 1 : 0;
      r.el.style.transform = `scale(${(.3 + .7 * eBack(k)) * (1 - .12 * fecha)}) scaleY(${1 + .15 * Math.sin(Math.PI * cl(k))})`;
    } else {
      // cada eco sai de trás do anterior, em cascata para cima e para baixo, até encher a tela
      const k = (lt - .5 - d * .07) / .45;
      const volta = t >= T_LOGO ? eIn((t - T_LOGO - (6 - Math.min(d, 6)) * .02) / .3) : 0;
      const pos = Math.sign(r.o) * PASSO * (d - 1 + eBack(k)) * (1 - volta);
      r.el.style.opacity = k > 0 ? 1 : 0;
      r.el.style.transform = `translateY(${pos}px) translateX(${(d % 2 ? 1 : -1) * 14 * Math.sin((lt - 1.3) * 3) * cl(lt - 1.2)}px)`;
    }
  });

  // logo: círculo vermelho cobre, some revelando o mercado de novo; logo entra em elástico + brilho
  const gt = t - T_LOGO;
  $('flash').style.clipPath = `circle(${gt > .2 ? R * eOut((gt - .2) / .4) : 0}px at 50% 50%)`;
  $('flash').style.opacity = 1 - cl((gt - .7) / .4);
  if (gt > .55) $('letter').style.clipPath = 'circle(0 at 50% 50%)';
  av.style.opacity = t >= T_LET + .45 ? 0 : 1;
  $('chao').style.opacity = t >= T_LET + .45 ? 0 : $('chao').style.opacity;
  const lk = (gt - .55) / .8;
  $('logo').style.opacity = lk > 0 ? 1 : 0;
  $('logo').style.transform = `scale(${lk > 0 ? eEl(lk) * (1 + .02 * Math.sin(t * 3)) : 0}) rotate(${(1 - eOut(lk)) * -8}deg)`;
  const bk = (gt - 1.3) / .7; $('faixa').style.left = (-30 + 140 * cl(bk)) + '%';
};
window.DUR = DUR;
window.pronto = (async () => {
  PES = window.PES; NQ = PES.length;
  await document.fonts.ready; montaLettering(); await window.setT(0);
})();
</script>
</body></html>
