<!doctype html><meta charset="utf-8"><meta name="tamanho" content="2710x1730"><link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Banner Ano Novo 2027 · Itamar Supermercado · 2,71 m x 1,73 m (largura x altura). 1 px = 1 mm.
     Render: node render.js  (gera PNG 5420x3460 = 50 dpi no tamanho real, PDF e prévia) -->
<style>
:root{--amarelo:#FFD302;--vermelho:#FF291E;--marrom:#280E01}
*{box-sizing:border-box;margin:0}
html,body{width:2710px;height:1730px;overflow:hidden;background:var(--amarelo)}
svg{display:block;width:2710px;height:1730px}
text{font-family:"Baloo 2",sans-serif;font-weight:800}
.logo{position:absolute;left:110px;top:90px;width:520px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
@page{size:2710px 1730px;margin:0}
</style>
<svg viewBox="0 0 2710 1730" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- dobra (vinco) da folha: do topo até a base -->
  <path id="vinco" d="M2290 0 C2150 430 1830 980 1500 1730"/>
  <clipPath id="folha"><path d="M0 0 H2290 C2150 430 1830 980 1500 1730 H0 Z"/></clipPath>
  <clipPath id="fundo"><path d="M2290 0 C2150 430 1830 980 1500 1730 H2710 V0 Z"/></clipPath>
  <radialGradient id="gFolha" cx="38%" cy="42%" r="75%"><stop offset="0" stop-color="#4A1C04"/><stop offset=".55" stop-color="#280E01"/><stop offset="1" stop-color="#180800"/></radialGradient>
  <radialGradient id="gFundo" cx="80%" cy="45%" r="70%"><stop offset="0" stop-color="#FFE45C"/><stop offset=".6" stop-color="#FFD302"/><stop offset="1" stop-color="#F7B500"/></radialGradient>
  <linearGradient id="gAba" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4A3A"/><stop offset=".55" stop-color="#FF291E"/><stop offset="1" stop-color="#B8120A"/></linearGradient>
  <linearGradient id="gNum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9E2DA"/></linearGradient>
  <linearGradient id="gSete" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A1C04"/><stop offset="1" stop-color="#280E01"/></linearGradient>
  <filter id="blur40" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="blur22" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>

<!-- camada de baixo (amarela) -->
<rect width="2710" height="1730" fill="url(#gFundo)"/>
<g clip-path="url(#fundo)">
  <g id="fogosFundo" stroke="#280E01" stroke-linecap="round" fill="none" opacity=".55"></g>
  <text id="sete" x="1960" y="1120" font-size="900" fill="url(#gSete)">7</text>
  <!-- sombra da dobra sobre o amarelo -->
  <use href="#vinco" stroke="#5A2A00" stroke-width="150" fill="none" filter="url(#blur40)" opacity=".5"/>
  <text x="2610" y="1385" text-anchor="end" font-size="62" font-weight="600" fill="#280E01">O Itamar Supermercado</text>
  <text x="2610" y="1463" text-anchor="end" font-size="62" font-weight="600" fill="#280E01">deseja a você e à sua família</text>
  <text x="2610" y="1553" text-anchor="end" font-size="84" fill="#280E01">um Feliz Ano Novo!</text>
  <text x="2610" y="1652" text-anchor="end" font-size="56" fill="#280E01">@itamarsupermercado</text>
</g>

<!-- folha de cima (marrom) -->
<g clip-path="url(#folha)">
  <rect width="2710" height="1730" fill="url(#gFolha)"/>
  <g id="fogosFolha" stroke="#FFD302" stroke-linecap="round" fill="none"></g>
  <text x="215" y="1120" font-size="900" fill="url(#gNum)" letter-spacing="-12">202</text>
  <text x="228" y="490" font-size="120" fill="#FFD302" letter-spacing="14">FELIZ</text>
  <text x="228" y="1300" font-size="120" fill="#FFD302" letter-spacing="14">ANO NOVO</text>
  <!-- sombra da aba sobre a folha -->
  <path d="M2290 0 C2150 430 1830 980 1500 1730 C1470 1180 1640 520 2290 0Z" fill="#000" opacity=".55" filter="url(#blur40)" transform="translate(-55 18)"/>
</g>

<!-- aba dobrada (verso vermelho da folha) -->
<path d="M2290 0 C2150 430 1830 980 1500 1730 C1470 1180 1640 520 2290 0Z" fill="url(#gAba)"/>
<path d="M2290 0 C2150 430 1830 980 1500 1730" stroke="#fff" stroke-opacity=".35" stroke-width="5" fill="none"/>
</svg>
<img class="logo" src="../../identidade/logo-itamar-3d-transparente.png" alt="Itamar Supermercado">
<script>
// fogos em traço (determinísticos)
function fogos(id,cx,cy,r,n,w){const g=document.getElementById(id);let s='';
  for(let i=0;i<n;i++){const a=i*2*Math.PI/n,longo=i%2===0;
    const r0=r*(longo?.22:.35),r1=r*(longo?1:.72);
    const p=(q)=>(cx+Math.cos(a)*q).toFixed(1)+' '+(cy+Math.sin(a)*q).toFixed(1);
    s+=`<path d="M${p(r0)} L${p(r1)}" stroke-width="${w}" ${longo?'':`stroke-dasharray="${w*2.4} ${w*3}"`}/>`;
    if(longo)s+=`<circle cx="${(cx+Math.cos(a)*r*1.12).toFixed(1)}" cy="${(cy+Math.sin(a)*r*1.12).toFixed(1)}" r="${w*.9}" fill="currentColor" stroke="none"/>`;}
  g.innerHTML+=s;}
document.getElementById('fogosFolha').style.color='#FFD302';
document.getElementById('fogosFundo').style.color='#280E01';
fogos('fogosFolha',1120,250,170,24,7);
fogos('fogosFolha',1760,330,105,18,5);
fogos('fogosFolha',150,1050,120,20,5);
fogos('fogosFolha',1080,1490,130,20,6);
fogos('fogosFundo',2500,250,150,24,6);
fogos('fogosFundo',2560,1090,95,18,5);
</script>
