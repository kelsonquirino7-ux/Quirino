<!-- Lettering animado do Reels "Plantio de árvores · Praça de Boa Espera" (Prefeito Vitor).
     Cada .q é um lettering; data-dur = segundos na tela. Quadros: node render-lettering.js -->
<link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<style>
:root{--esc:#3A1778;--rosa:#FF4FA3;--ama:#FFD21E;--tur:#19C8E6;--lima:#7ED321;--lar:#FF8A1F;--lil:#B15CFF;--roxo:#7B2FF7}
*{margin:0;box-sizing:border-box}
html,body{background:transparent}
body{width:1080px;font-family:"Lilita One";text-transform:uppercase}
.q{position:relative;width:1080px;height:1920px;overflow:hidden}
.wrap{position:absolute;inset:0;transform-origin:45% 68%;animation:sai .25s cubic-bezier(.5,0,.9,.4) both;animation-delay:calc(var(--dur)*1s - .25s)}
@keyframes sai{to{transform:scale(0) rotate(-10deg);opacity:0}}
@keyframes pop{0%{transform:translateY(90px) scale(0) rotate(-25deg)}100%{transform:none}}
@keyframes popc{0%{transform:scale(0) rotate(-20deg)}100%{transform:none}}
@keyframes entra{0%{transform:translateX(-900px) rotate(-8deg)}100%{transform:none}}
@keyframes bal{0%{transform:translateY(-7px) rotate(-3.5deg)}100%{transform:translateY(7px) rotate(3.5deg)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pisca{0%{transform:scale(.8) rotate(-10deg)}100%{transform:scale(1.15) rotate(10deg)}}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(0);opacity:1}15%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.5)) rotate(120deg) scale(1);opacity:1}
  100%{transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(540deg) scale(1);opacity:0}}
.ov{cubic:0}
.bloco{position:absolute;left:70px;transform:rotate(-5deg);transform-origin:left top;white-space:nowrap}
/* palavra grande em 3 camadas (contorno escuro, contorno branco, cor) */
.g{display:grid;line-height:1;margin-top:6px}
.g>span{grid-area:1/1;display:block}
.g i{font-style:normal;display:inline-block;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.28s + var(--i)*.055s)}
.g b{font-weight:400;display:inline-block;animation:bal .55s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.17s)}
.g .c1 b{color:var(--esc);-webkit-text-stroke:40px var(--esc);filter:drop-shadow(0 16px 0 var(--esc)) drop-shadow(0 14px 14px rgba(0,0,0,.35))}
.g .c2 b{color:#fff;-webkit-text-stroke:18px #fff}
.g .c3 b{background:linear-gradient(180deg,color-mix(in srgb,var(--c),#fff 55%) 8%,var(--c) 52%,color-mix(in srgb,var(--c),#000 16%) 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
.g .esp{display:inline-block;width:.28em}
/* faixa pequena */
.p{display:inline-block;font-size:78px;line-height:1;padding:20px 38px 12px;border-radius:26px;border:8px solid #fff;
  box-shadow:0 0 0 7px var(--esc),0 14px 0 7px var(--esc),0 26px 24px rgba(0,0,0,.3);margin-left:14px;
  animation:entra .5s cubic-bezier(.34,1.4,.64,1) both;animation-delay:.05s;
  background-image:radial-gradient(rgba(255,255,255,.28) 22%,transparent 24%);background-size:26px 26px}
.p.roxo{background-color:var(--roxo);color:#fff}.p.ama{background-color:var(--ama);color:var(--esc);background-image:radial-gradient(rgba(255,138,31,.35) 22%,transparent 24%)}
.p.tur{background-color:var(--tur);color:var(--esc)}
/* selo do titulo */
.cx1{display:inline-block;background-color:var(--ama);background-image:radial-gradient(rgba(255,138,31,.38) 22%,transparent 24%);background-size:30px 30px;
  padding:26px 52px 26px 44px;border-radius:40px;border:10px solid #fff;box-shadow:0 0 0 8px var(--esc),0 18px 0 8px var(--esc),0 34px 30px rgba(0,0,0,.35);
  animation:popc .5s cubic-bezier(.34,1.56,.64,1) both}
.cx1 small{display:block;font-size:84px;line-height:1;color:var(--esc)}
.cx2{position:relative;display:inline-block;margin:-6px 0 0 80px;font-size:66px;line-height:1;padding:24px 40px 16px;border-radius:28px;border:8px solid #fff;
  background-color:var(--roxo);color:#fff;background-image:radial-gradient(rgba(255,255,255,.2) 22%,transparent 24%);background-size:26px 26px;
  box-shadow:0 0 0 7px var(--esc),0 14px 0 7px var(--esc),0 26px 24px rgba(0,0,0,.3);animation:entra .5s cubic-bezier(.34,1.4,.64,1) both;animation-delay:.5s}
/* enfeites */
.e{position:absolute;animation:popc .45s cubic-bezier(.34,1.8,.64,1) both}
.e svg{display:block;overflow:visible}
.e .gira{animation:gira 6s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
.e .pisca{animation:pisca .5s ease-in-out infinite alternate;transform-origin:50% 50%;transform-box:fill-box}
.cf{position:absolute;width:26px;height:16px;border-radius:5px;animation:conf 1.3s cubic-bezier(.2,.7,.4,1) both;animation-delay:.22s}
