<!-- Ref.: fundo amarelo, "REPÚBLICA" em eco, quadro central com a bandeira, balões de coração (estilo Designi). -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:"Baloo 2",sans-serif;color:#280E01;

.eco{position:absolute;top:178px;left:0;right:0;text-align:center;font:800 186px/.86 "Baloo 2";letter-spacing:.02em}

.quadro{position:absolute;left:290px;top:272px;width:500px;height:600px;border-radius:40px;overflow:hidden;

.b1{left:70px;top:520px;transform:rotate(-12deg) scale(1.1);filter:blur(1px)}
.b2{right:70px;top:240px;transform:rotate(10deg) scale(.85);filter:blur(.5px)}
.fita{position:absolute;width:520px;height:120px;filter:blur(10px);background:linear-gradient(90deg,#009C3B 0 34%,#FFDF00 34% 66%,#009C3B 66%)}

.f2{right:-170px;bottom:120px;transform:rotate(-58deg)}

.logo{position:absolute;left:50%;transform:translateX(-50%);top:24px;height:104px;filter:drop-shadow(0 6px 10px rgba(120,70,0,.3))}
