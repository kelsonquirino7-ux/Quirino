<!doctype html><html><head><meta charset="utf-8">
<meta name="tamanho" content="1920x1080">
<link rel="stylesheet" href="../../../ferramentas/fontes.css">
<style>
:root{--azul:#2B4BFF;--neon:#00E58F;--noite:#0B1033;--ciano:#19C3FF}
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:"Exo 2";color:#fff}
.foto{position:absolute;inset:0;background:url(base.jpg) center/cover}
.vinheta{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(11,16,51,.55) 100%),linear-gradient(transparent 70%,rgba(11,16,51,.55))}
.logo{position:absolute;top:44px;right:56px;width:300px;filter:drop-shadow(0 4px 14px rgba(11,16,51,.7))}
.missao{position:absolute;top:56px;left:56px;background:rgba(11,16,51,.82);border-left:8px solid var(--neon);padding:22px 34px 24px;border-radius:6px}
.missao small{display:block;font:700 22px "Exo 2";letter-spacing:.18em;color:var(--neon)}
.missao b{display:block;font:800 64px/1.05 "Exo 2";letter-spacing:.01em;margin-top:6px}
.missao span{display:block;font:500 26px "Exo 2";color:#EEF2FF;margin-top:8px}
.mapa{position:absolute;left:56px;bottom:56px;width:290px;height:290px;border-radius:50%;background:var(--noite);border:6px solid #fff;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.mapa svg{width:100%;height:100%}
.status{position:absolute;left:372px;bottom:70px;width:300px}
.barra{height:16px;border-radius:8px;background:rgba(11,16,51,.75);border:2px solid rgba(255,255,255,.8);margin-top:12px;overflow:hidden}
.barra i{display:block;height:100%}
.status p{font:700 22px "Exo 2";letter-spacing:.12em;text-shadow:0 2px 6px #000}
.alvo{position:absolute;left:1268px;top:150px;text-align:center;transform:translateX(-50%)}
.alvo .pin{width:56px;height:56px;margin:0 auto;background:var(--neon);border:5px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.alvo .tag{margin-top:14px;background:rgba(11,16,51,.85);padding:6px 16px;border-radius:4px;font:700 22px "Exo 2";letter-spacing:.1em}
.dica{position:absolute;right:56px;bottom:62px;background:rgba(11,16,51,.82);padding:16px 26px;border-radius:6px;font:600 26px "Exo 2";display:flex;gap:16px;align-items:center}
.dica kbd{font:800 24px "Exo 2";background:#fff;color:var(--noite);border-radius:6px;padding:4px 14px}
</style></head><body>
<div class="foto"></div><div class="vinheta"></div>
<div class="missao"><small>NOVA ÁREA DESBLOQUEADA</small><b>SANTANÓPOLIS</b><span>Bahia · mapa aberto para explorar</span></div>
<div class="alvo"><div class="pin"></div><div class="tag">CENTRO</div></div>
<img class="logo" src="../../../logo/fontes/A-pixel-branco.svg" alt="quirino">
<div class="mapa"><svg viewBox="0 0 100 100">
 <rect width="100" height="100" fill="#13306b"/>
 <g fill="#1d4a2e"><circle cx="20" cy="25" r="18"/><circle cx="82" cy="70" r="22"/><circle cx="15" cy="80" r="16"/></g>
 <g stroke="#EEF2FF" stroke-width="5" fill="none" stroke-linecap="round"><path d="M55 110 L52 60 Q52 45 70 35 L95 15"/><path d="M48 110 L40 62 L30 40"/><path d="M5 30 Q25 38 40 40"/></g>
 <g stroke="#19C3FF" stroke-width="2" fill="none"><path d="M30 40 L70 30 M35 25 L75 28 M40 48 L66 42"/></g>
 <circle cx="62" cy="30" r="5" fill="#00E58F" stroke="#fff" stroke-width="1.5"/>
 <path d="M50 58 l-6 12 6-3 6 3z" fill="#fff"/>
</svg></div>
<div class="status"><p>ENERGIA</p><div class="barra"><i style="width:86%;background:#00E58F"></i></div><div class="barra"><i style="width:64%;background:#19C3FF"></i></div></div>
<div class="dica"><kbd>▶</kbd> Pressione para explorar</div>
</body></html>
