<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1080x1920"><link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Story 20 de novembro · Dia da Consciência Negra · Deni de Vitor (1080x1920). Punho 3D gerado no Magnific (punho-3d.png); grafismos em SVG. -->
<style>
:root{--fundo:#E4D2AE;--preto:#141414;--verde:#00802B;--amarelo:#F2B705;--vermelho:#EB1C24;--ouro:#C99A2E}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;background:radial-gradient(120% 80% at 50% 45%,#EBDDBE 0%,var(--fundo) 55%,#D8C39A 100%);font-family:Montserrat,sans-serif;color:var(--preto);position:relative;overflow:hidden}
.data{position:absolute;top:250px;left:0;right:0;text-align:center;line-height:.9}
.data b{display:block;font:600 52px Montserrat}.data span{display:block;font:900 52px Montserrat;letter-spacing:-.01em}
.dia{position:absolute;top:400px;left:0;right:0;text-align:center;font:600 44px Montserrat;letter-spacing:.42em;color:#3A3329;padding-left:.42em}
h1{position:absolute;top:448px;left:0;right:0;text-align:center;font:900 132px/1 Montserrat;letter-spacing:-.035em;text-transform:lowercase}
h2{position:absolute;top:580px;right:150px;font:900 86px/1 Montserrat;letter-spacing:-.03em}
.faixa{position:absolute;height:170px;overflow:hidden;box-shadow:0 10px 24px rgba(60,40,10,.18)}
.faixa svg{display:block;height:100%}
.f1{top:780px;left:220px;width:700px}.f2{top:980px;left:110px;width:420px}.f3{top:1180px;left:220px;width:700px}
.punho{position:absolute;left:50%;transform:translateX(-50%);top:690px;height:880px;filter:drop-shadow(0 30px 30px rgba(40,25,5,.35))}
.sombra{position:absolute;left:380px;top:1540px;width:320px;height:46px;border-radius:50%;background:radial-gradient(closest-side,rgba(50,30,5,.45),transparent)}
.frase{position:absolute;left:100px;top:1370px;width:310px;font:600 36px/1.38 Montserrat;color:#2B241B}
.assina{position:absolute;bottom:150px;left:50%;transform:translateX(-50%)}
.assina img{height:150px;display:block}
</style>
<div class="data"><b>20</b><span>nov</span></div>
<div class="dia">dia da</div>
<h1>consciência</h1>
<h2>negra</h2>
<div class="faixa f1" data-n="7" data-s="1"></div>
<div class="faixa f2" data-n="4" data-s="5"></div>
<div class="faixa f3" data-n="7" data-s="9"></div>
<div class="sombra"></div>
<img class="punho" src="punho-3d.png" alt="">
<p class="frase">Memória, respeito e igualdade se constroem todos os dias.</p>
<div class="assina"><img src="../../identidade/logo-deni-de-vitor-transparente.png" alt="Deni de Vitor"></div>
<script>
const C={v:'#00802B',a:'#F2B705',r:'#EB1C24',p:'#141414'};
const M=[
 (c1,c2,c3)=>`<rect width="100" height="100" fill="${c1}"/>`+[0,25,50].map(y=>`<path d="M0 ${y+20} L50 ${y+45} L100 ${y+20} L100 ${y+35} L50 ${y+60} L0 ${y+35}Z" fill="${c2}"/>`).join(''),
 (c1,c2,c3)=>`<rect width="100" height="100" fill="${c1}"/><path d="M50 8 L92 50 L50 92 L8 50Z" fill="${c2}"/><path d="M50 30 L70 50 L50 70 L30 50Z" fill="${c3}"/>`,
 (c1,c2,c3)=>`<rect width="100" height="100" fill="${c1}"/>`+[0,1,2,3,4].map(i=>`<path d="M${i*20-10} 0 L${i*20+10} 0 L${i*20-30} 100 L${i*20-50} 100Z" transform="translate(40 0)" fill="${c2}"/>`).join(''),
 (c1,c2,c3)=>`<rect width="100" height="100" fill="${c1}"/><circle cx="50" cy="50" r="40" fill="${c2}"/><circle cx="50" cy="50" r="26" fill="${c3}"/><circle cx="50" cy="50" r="11" fill="${c1}"/>`,
 (c1,c2,c3)=>`<rect width="100" height="100" fill="${c1}"/><path d="M0 100 L25 55 L50 100Z M50 100 L75 55 L100 100Z" fill="${c2}"/><path d="M0 0 L25 45 L50 0Z M50 0 L75 45 L100 0Z" fill="${c3}"/>`,
 (c1,c2,c3)=>`<rect width="100" height="100" fill="${c1}"/><rect y="12" width="100" height="14" fill="${c2}"/><rect y="74" width="100" height="14" fill="${c2}"/><rect x="14" y="38" width="16" height="24" fill="${c3}"/><rect x="42" y="38" width="16" height="24" fill="${c3}"/><rect x="70" y="38" width="16" height="24" fill="${c3}"/>`,
 (c1,c2,c3)=>`<rect width="100" height="100" fill="${c1}"/><path d="M0 50 L20 30 L40 50 L60 30 L80 50 L100 30 L100 46 L80 66 L60 46 L40 66 L20 46 L0 66Z" fill="${c2}"/><rect y="80" width="100" height="10" fill="${c3}"/><rect y="10" width="100" height="10" fill="${c3}"/>`,
 (c1,c2,c3)=>`<rect width="100" height="100" fill="${c1}"/><rect width="50" height="50" fill="${c2}"/><rect x="50" y="50" width="50" height="50" fill="${c2}"/><path d="M25 10 L40 25 L25 40 L10 25Z M75 60 L90 75 L75 90 L60 75Z" fill="${c3}"/>`,
];
const P=[['v','a','p'],['p','a','r'],['a','p','r'],['r','a','p'],['v','p','a'],['a','v','p'],['p','r','a'],['r','p','a'],['v','a','r'],['p','v','a'],['a','r','v']];
document.querySelectorAll('.faixa').forEach(f=>{
 const n=+f.dataset.n,s=+f.dataset.s;let g='';
 for(let i=0;i<n;i++)for(let j=0;j<2;j++){const k=(s+i*3+j*5)%M.length,p=P[(s+i*2+j*7)%P.length];
  g+=`<g transform="translate(${i*100} ${j*100})">${M[k](C[p[0]],C[p[1]],C[p[2]])}</g>`;}
 f.innerHTML=`<svg viewBox="0 0 ${n*100} 200" preserveAspectRatio="xMinYMid slice" style="width:100%">${g}</svg>`;
});
</script>
