<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1080x1350"><link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Card Black Friday de Eletro (1080x1350) · Itamar Supermercado · 27/11/2026.
     Letreiro, faixa e selo são 3D: editar em cena-3d.html e rodar render-3d.js (gera letreiro-3d.png). -->
<style>
:root{--amarelo:#FFD302;--vermelho:#FF291E;--marrom:#280E01}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:"Baloo 2",sans-serif;color:var(--marrom);
  background:radial-gradient(ellipse at 50% 46%,#FF3A2A 0,#E81C10 45%,#B80E06 100%)}
#fundo,#letreiro{position:absolute;inset:0;width:1080px;height:1350px}
.logo{position:absolute;top:40px;left:0;right:0;text-align:center}
.logo img{height:215px;filter:drop-shadow(0 12px 16px rgba(40,14,1,.45))}
.rod{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--marrom);color:#fff;text-align:center;
  display:flex;flex-direction:column;justify-content:center;font:600 34px/1.25 "Baloo 2";border-top:8px solid var(--amarelo)}
.rod b{font:800 44px/1.1 "Baloo 2";color:var(--amarelo);letter-spacing:1px}
</style>
<svg id="fundo" viewBox="0 0 1080 1350">
  <defs>
    <g id="i-tv"><rect x="-44" y="-30" width="88" height="54" rx="6"/><path d="M-22 36h44M0 24v12"/></g>
    <g id="i-gel"><rect x="-26" y="-46" width="52" height="92" rx="7"/><path d="M-26 -12h52M-14 -34v12M-14 0v18"/></g>
    <g id="i-fog"><rect x="-34" y="-40" width="68" height="80" rx="6"/><path d="M-34 -18h68"/><rect x="-22" y="-6" width="44" height="32" rx="4"/><circle cx="-18" cy="-29" r="3"/><circle cx="0" cy="-29" r="3"/><circle cx="18" cy="-29" r="3"/></g>
    <g id="i-lav"><rect x="-34" y="-42" width="68" height="84" rx="7"/><path d="M-34 -22h68"/><circle cx="0" cy="10" r="20"/><circle cx="-20" cy="-32" r="3"/></g>
    <g id="i-mic"><rect x="-46" y="-28" width="92" height="56" rx="6"/><rect x="-36" y="-18" width="52" height="36" rx="3"/><path d="M30 -14v8M30 4v8"/></g>
    <g id="i-liq"><path d="M-18 -44h36l-6 52h-24zM-22 8h44v30h-44zM18 -30h14v22h-12"/></g>
    <g id="i-pct"><circle cx="-18" cy="-20" r="13"/><circle cx="18" cy="20" r="13"/><path d="M22 -34L-22 34"/></g>
    <pattern id="pad" width="360" height="330" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <g fill="none" stroke="#8E0A04" stroke-opacity=".5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <use href="#i-tv" x="60" y="55"/><use href="#i-gel" x="180" y="60" transform="rotate(8 180 60)"/><use href="#i-pct" x="300" y="55"/>
        <use href="#i-lav" x="120" y="165" transform="rotate(-6 120 165)"/><use href="#i-mic" x="250" y="165"/><use href="#i-pct" x="0" y="165"/><use href="#i-pct" x="360" y="165"/>
        <use href="#i-fog" x="60" y="275"/><use href="#i-liq" x="180" y="275" transform="rotate(6 180 275)"/><use href="#i-tv" x="300" y="275" transform="rotate(-5 300 275)"/>
      </g>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="url(#pad)"/>
</svg>
<img id="letreiro" src="letreiro-3d.png" alt="Black Friday de Eletro · sexta-feira 27/11">
<div class="logo"><img src="../../identidade/logo-itamar-3d-transparente.png" alt="Itamar Supermercado"></div>
