<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1080x1350"><link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Card Black Friday de Eletro (1080x1350) · Itamar Supermercado · 27/11/2026.
     Para editar: textos em .faixa, .selo e .rod; letreiro nas constantes LINHAS do script. -->
<style>
:root{--amarelo:#FFD302;--vermelho:#FF291E;--marrom:#280E01}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:"Baloo 2",sans-serif;color:var(--marrom);
  background:radial-gradient(ellipse at 50% 46%,#FF3A2A 0,#E81C10 45%,#B80E06 100%)}
#fundo,#letreiro{position:absolute;inset:0}
.logo{position:absolute;top:40px;left:0;right:0;text-align:center}
.logo img{height:215px;filter:drop-shadow(0 12px 16px rgba(40,14,1,.45))}
.faixa{position:absolute;left:50%;top:1036px;transform:translateX(-50%) rotate(-6deg);background:var(--amarelo);
  font:800 96px/1 "Baloo 2";padding:14px 50px 0;border-radius:22px;white-space:nowrap;letter-spacing:2px;
  box-shadow:8px 10px 0 var(--marrom),0 26px 40px rgba(40,14,1,.4)}
.selo{position:absolute;right:30px;top:232px;width:236px;height:236px;display:grid;place-items:center;transform:rotate(9deg);filter:drop-shadow(6px 9px 0 rgba(40,14,1,.55))}
.selo svg{position:absolute;inset:0}
.selo div{position:relative;text-align:center;font:800 29px/1 "Baloo 2";padding-top:8px}
.selo b{display:block;font:800 76px/.95 "Baloo 2";color:#C4120A}
.rod{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--marrom);color:#fff;text-align:center;
  display:flex;flex-direction:column;justify-content:center;font:600 34px/1.25 "Baloo 2";border-top:8px solid var(--amarelo)}
.rod b{font:800 44px/1.1 "Baloo 2";color:var(--amarelo);letter-spacing:1px}
</style>
<svg id="fundo" viewBox="0 0 1080 1350">
  <defs>
    <g id="i-tv"><rect x="-44" y="-30" width="88" height="54" rx="6"/><path d="M-22 36h44M0 24v12"/></g>
    <g id="i-gel"><rect x="-26" y="-46" width="52" height="92" rx="7"/><path d="M-26 -12h52M-14 -34v12M-14 0v18"/></g>
    <g id="i-fog"><rect x="-34" y="-40" width="68" height="80" rx="6"/><path d="M-34 -18h68"/><rect x="-22" y="-6" width="44" height="32" rx="4"/><circle cx="-18" cy="-29" r="3"/><circle cx="0" cy="-29" r="3"/><circle cx="18" cy="-29" r="3"/></g>
    <g id="i-lav"><rect x="-34" y="-42" width="68" height="84" rx="7"/><path d="M-34 -22h68"/><circle cx="0" cy="10" r="20"/><circle cx="-20" cy="-32" r="3"/></g>
    <g id="i-mic"><rect x="-46" y="-28" width="92" height="56" rx="6"/><rect x="-36" y="-18" width="52" height="36" rx="3"/><path d="M30 -14v8M30 4v8"/></g>
    <g id="i-liq"><path d="M-18 -44h36l-6 52h-24zM-22 8h44v30h-44zM18 -30h14v22h-12"/></g>
    <g id="i-pct"><circle cx="-18" cy="-20" r="13"/><circle cx="18" cy="20" r="13"/><path d="M22 -34L-22 34"/></g>
    <pattern id="pad" width="360" height="330" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <g fill="none" stroke="#8E0A04" stroke-opacity=".5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <use href="#i-tv" x="60" y="55"/><use href="#i-gel" x="180" y="60" transform="rotate(8 180 60)"/><use href="#i-pct" x="300" y="55"/>
        <use href="#i-lav" x="120" y="165" transform="rotate(-6 120 165)"/><use href="#i-mic" x="250" y="165"/><use href="#i-pct" x="0" y="165"/><use href="#i-pct" x="360" y="165"/>
        <use href="#i-fog" x="60" y="275"/><use href="#i-liq" x="180" y="275" transform="rotate(6 180 275)"/><use href="#i-tv" x="300" y="275" transform="rotate(-5 300 275)"/>
      </g>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="url(#pad)"/>
  <!-- recortes de papel -->
  <g fill="#FFD302" stroke="#280E01" stroke-width="0">
    <path d="M52 470l96 -34 -40 82z"/><path d="M150 400l52 30 -58 22z" fill="#fff"/>
    <path d="M1030 960l-98 30 44 -80z"/><path d="M930 1030l-50 -32 60 -18z" fill="#fff"/>
  </g>
</svg>
<svg id="letreiro" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A2416"/><stop offset="1" stop-color="#280E01"/></linearGradient>
    <filter id="somb" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#280E01" flood-opacity=".55"/></filter>
    <g id="pal" font-family="Baloo 2" font-weight="800" text-anchor="middle"></g>
  </defs>
  <g transform="translate(-12 34) rotate(-7 540 690)">
    <use href="#pal" fill="#FF291E" stroke="#FF291E" stroke-width="78" stroke-linejoin="round" filter="url(#somb)"/>
    <g id="ext" fill="#0E0400" stroke="#0E0400" stroke-width="5" stroke-linejoin="round"></g>
    <use href="#pal" x="-3" y="-3" fill="#FF6A55"/>
    <use href="#pal" fill="url(#face)"/>
  </g>
</svg>
<div class="logo"><img src="../../identidade/logo-itamar-3d-transparente.png" alt="Itamar Supermercado"></div>
<div class="selo"><svg viewBox="-135 -135 270 270"><polygon id="estrela" fill="#FFD302"/></svg><div>SEXTA-FEIRA<b>27/11</b>NO ITAMAR</div></div>
<div class="faixa">DE ELETRO</div>
<p class="rod"><b>SEXTA-FEIRA, 27 DE NOVEMBRO</b>@itamarsupermercado</p>
<script>
// [texto, tamanho, linha de base Y, largura-alvo, variações por letra: rotação°, deslocY, escala]
const LINHAS=[["BLACK",300,640,800,[[-5,6,1],[4,-10,.94],[-3,8,1.06],[5,-6,.96],[-4,10,1.04]]],
              ["FRIDAY",300,900,920,[[4,-4,1.04],[-5,10,.95],[3,-12,1.05],[-4,6,.97],[5,-8,1.06],[-3,8,1]]]];
document.fonts.load('800 100px "Baloo 2"').then(()=>{
  const ns="http://www.w3.org/2000/svg",pal=document.getElementById("pal"),c=document.createElement("canvas").getContext("2d");
  for(const [t,fs,y,alvo,v] of LINHAS){
    c.font=`800 ${fs}px "Baloo 2"`;const w=[...t].map(ch=>c.measureText(ch).width);
    const k=alvo/w.reduce((a,b)=>a+b,0);let x=540-alvo/2;
    [...t].forEach((ch,i)=>{const cx=x+w[i]*k/2;x+=w[i]*k;const [r,dy,s]=v[i];
      const e=document.createElementNS(ns,"text");e.textContent=ch;e.setAttribute("font-size",fs*k);
      e.setAttribute("transform",`translate(${cx} ${y+dy}) rotate(${r} 0 ${-fs*k*.33}) scale(${s})`);pal.appendChild(e);});
  }
  const ext=document.getElementById("ext");
  for(let i=30;i>=1;i--){const u=document.createElementNS(ns,"use");u.setAttribute("href","#pal");u.setAttribute("x",i*1.1);u.setAttribute("y",i*1.5);ext.appendChild(u);}
  let p=[];for(let i=0;i<48;i++){const a=i*Math.PI/24,r=i%2?120:135;p.push((r*Math.cos(a)).toFixed(1)+","+(r*Math.sin(a)).toFixed(1));}
  document.getElementById("estrela").setAttribute("points",p.join(" "));
});
</script>
