<style>

.logo{position:absolute;top:58px;left:0;right:0;text-align:center}
.logo img{height:112px}
.gigante{position:absolute;left:0;right:0;top:215px;text-align:center;font:800 330px/1 "Exo 2";letter-spacing:-.04em;color:rgba(255,255,255,.17);white-space:nowrap}
.gigante.reflexo{top:520px;transform:scaleY(-1);color:rgba(255,255,255,.10);-webkit-mask-image:linear-gradient(to top,#000 0,transparent 75%)}
.foto{position:absolute;left:150px;top:170px;width:780px;height:780px;background:url(../../fotos/social/2026-11-12-cesta-basica-saco-recortada-ia.png) center/cover}
.sombra{position:absolute;left:190px;top:800px;width:700px;height:120px;border-radius:50%;background:rgba(0,8,26,.55);filter:blur(34px)}
.contato{position:absolute;left:285px;top:838px;width:520px;height:36px;border-radius:50%;background:rgba(0,4,16,.9);filter:blur(12px)}
.base{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(to top,#001B40 0,#001B40 55%,transparent 100%)}
.texto{position:absolute;left:60px;right:60px;top:915px;text-align:center}
.mais{font:700 44px/1 "Exo 2";letter-spacing:.16em;color:var(--tinta)}

.sub{font:700 46px/1.15 "Exo 2";margin-top:14px}
.sub span{color:var(--tinta);font-weight:500}
.tag{display:inline-block;margin-top:26px;background:#fff;color:var(--azul);font:700 27px/1 "Exo 2";letter-spacing:.04em;padding:16px 28px;border-radius:999px}
footer{position:absolute;left:60px;right:60px;bottom:30px;display:flex;justify-content:center;align-items:center;font:500 24px "Exo 2";letter-spacing:.04em;color:var(--tinta)}
footer small{font:400 18px Inter;opacity:.85}

<div class="padrao"></div>
<div class="gigante">10 TON</div><div class="gigante reflexo">10 TON</div>
<div class="sombra"></div><div class="contato"></div><div class="foto"></div>
<div class="base"></div>
<div class="logo"><img src="../../identidade/logo-prefeitura-branco.png" alt=""></div>
<div class="texto">
  <h1>10 TONELADAS</h1>
