<!doctype html><html><head><meta charset="utf-8">
<!-- Lettering animado do Reels "Plantio de árvores · Praça de Boa Espera" (Prefeito Vitor).
     Cada .q é um lettering; data-dur = segundos na tela. Quadros: node render-lettering.js -->
<link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<style>
:root{--esc:#3A1778;--rosa:#FF4FA3;--ama:#FFD21E;--tur:#19C8E6;--lima:#7ED321;--lar:#FF8A1F;--lil:#B15CFF;--roxo:#7B2FF7}
*{margin:0;box-sizing:border-box}
html,body{background:transparent}
body{width:1080px;font-family:"Lilita One";text-transform:uppercase}
.q{position:relative;width:1080px;height:1920px;overflow:hidden}
.wrap{position:absolute;inset:0;transform-origin:45% 68%;animation:sai .25s cubic-bezier(.5,0,.9,.4) both;animation-delay:calc(var(--dur)*1s - .25s)}
@keyframes sai{to{transform:scale(0) rotate(-10deg);opacity:0}}
@keyframes pop{0%{transform:translateY(90px) scale(0) rotate(-25deg)}100%{transform:none}}
@keyframes popc{0%{transform:scale(0) rotate(-20deg)}100%{transform:none}}
@keyframes entra{0%{transform:translateX(-900px) rotate(-8deg)}100%{transform:none}}
@keyframes bal{0%{transform:translateY(-7px) rotate(-3.5deg)}100%{transform:translateY(7px) rotate(3.5deg)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pisca{0%{transform:scale(.8) rotate(-10deg)}100%{transform:scale(1.15) rotate(10deg)}}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(0);opacity:1}15%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.5)) rotate(120deg) scale(1);opacity:1}
  100%{transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(540deg) scale(1);opacity:0}}
.ov{cubic:0}
.bloco{position:absolute;left:70px;transform:rotate(-5deg);transform-origin:left top;white-space:nowrap}
/* palavra grande em 3 camadas (contorno escuro, contorno branco, cor) */
.g{display:grid;line-height:1;margin-top:6px}
.g>span{grid-area:1/1;display:block}
.g i{font-style:normal;display:inline-block;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.28s + var(--i)*.055s)}
.g b{font-weight:400;display:inline-block;animation:bal .55s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.17s)}
.g .c1 b{color:var(--esc);-webkit-text-stroke:40px var(--esc);filter:drop-shadow(0 16px 0 var(--esc)) drop-shadow(0 14px 14px rgba(0,0,0,.35))}
.g .c2 b{color:#fff;-webkit-text-stroke:18px #fff}
.g .c3 b{background:linear-gradient(180deg,color-mix(in srgb,var(--c),#fff 55%) 8%,var(--c) 52%,color-mix(in srgb,var(--c),#000 16%) 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
.g .esp{display:inline-block;width:.28em}
/* faixa pequena */
.p{display:inline-block;font-size:78px;line-height:1;padding:20px 38px 12px;border-radius:26px;border:8px solid #fff;
  box-shadow:0 0 0 7px var(--esc),0 14px 0 7px var(--esc),0 26px 24px rgba(0,0,0,.3);margin-left:14px;
  animation:entra .5s cubic-bezier(.34,1.4,.64,1) both;animation-delay:.05s;
  background-image:radial-gradient(rgba(255,255,255,.28) 22%,transparent 24%);background-size:26px 26px}
.p.roxo{background-color:var(--roxo);color:#fff}.p.ama{background-color:var(--ama);color:var(--esc);background-image:radial-gradient(rgba(255,138,31,.35) 22%,transparent 24%)}
.p.tur{background-color:var(--tur);color:var(--esc)}
/* selo do titulo */
.cx1{display:inline-block;background-color:var(--ama);background-image:radial-gradient(rgba(255,138,31,.38) 22%,transparent 24%);background-size:30px 30px;
  padding:26px 52px 26px 44px;border-radius:40px;border:10px solid #fff;box-shadow:0 0 0 8px var(--esc),0 18px 0 8px var(--esc),0 34px 30px rgba(0,0,0,.35);
  animation:popc .5s cubic-bezier(.34,1.56,.64,1) both}
.cx1 small{display:block;font-size:84px;line-height:1;color:var(--esc)}
.cx2{position:relative;display:inline-block;margin:-6px 0 0 80px;font-size:66px;line-height:1;padding:24px 40px 16px;border-radius:28px;border:8px solid #fff;
  background-color:var(--roxo);color:#fff;background-image:radial-gradient(rgba(255,255,255,.2) 22%,transparent 24%);background-size:26px 26px;
  box-shadow:0 0 0 7px var(--esc),0 14px 0 7px var(--esc),0 26px 24px rgba(0,0,0,.3);animation:entra .5s cubic-bezier(.34,1.4,.64,1) both;animation-delay:.5s}
/* enfeites */
.e{position:absolute;animation:popc .45s cubic-bezier(.34,1.8,.64,1) both}
.e svg{display:block;overflow:visible}
.e .gira{animation:gira 6s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
.e .pisca{animation:pisca .5s ease-in-out infinite alternate;transform-origin:50% 50%;transform-box:fill-box}
.cf{position:absolute;width:26px;height:16px;border-radius:5px;animation:conf 1.3s cubic-bezier(.2,.7,.4,1) both;animation-delay:.22s}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="estrela"><path d="M60 4l15 34 37 4-28 25 8 37-32-19-32 19 8-37L8 42l37-4z" fill="#FFD21E" stroke="#3A1778" stroke-width="16" stroke-linejoin="round"/><path d="M60 4l15 34 37 4-28 25 8 37-32-19-32 19 8-37L8 42l37-4z" fill="#FFD21E" stroke="#fff" stroke-width="7" stroke-linejoin="round"/></g>
  <g id="folha"><path d="M10 110C0 40 50 4 122 8c6 70-34 114-112 102z" fill="#7ED321" stroke="#3A1778" stroke-width="16" stroke-linejoin="round"/><path d="M10 110C0 40 50 4 122 8c6 70-34 114-112 102z" fill="#7ED321" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M22 98C50 70 78 44 106 24" fill="none" stroke="#0AA514" stroke-width="7" stroke-linecap="round"/></g>
  <g id="sol"><g class="gira"><path d="M100 0l18 38 38-18-6 42 42 6-30 30 30 30-42 6 6 42-38-18-18 38-18-38-38 18 6-42-42-6 30-30-30-30 42-6-6-42 38 18z" transform="translate(0,-2)" fill="#FF8A1F" stroke="#3A1778" stroke-width="10" stroke-linejoin="round"/></g>
    <circle cx="100" cy="98" r="56" fill="#FFD21E" stroke="#3A1778" stroke-width="9"/><circle cx="82" cy="90" r="7" fill="#3A1778"/><circle cx="118" cy="90" r="7" fill="#3A1778"/>
    <path d="M78 108q22 24 44 0" fill="none" stroke="#3A1778" stroke-width="8" stroke-linecap="round"/><circle cx="70" cy="106" r="8" fill="#FF4FA3" opacity=".7"/><circle cx="130" cy="106" r="8" fill="#FF4FA3" opacity=".7"/></g>
</defs></svg>

<div class="q" id="l1" data-dur="3.5"><div class="wrap">
  <div class="e" style="left:760px;top:880px;animation-delay:.18s"><svg width="230" height="230" viewBox="0 0 200 200"><use href="#sol"/></svg></div>
  <div class="bloco" style="top:1040px;left:80px">
    <div class="cx1"><small>Plantio de</small><div class="g" data-t="Árvores" style="font-size:168px"></div></div><br>
    <div class="cx2">Praça de Boa Espera</div>
  </div>
  <div class="e" style="left:22px;top:960px;animation-delay:.35s"><svg width="140" height="130" viewBox="0 0 130 120"><use href="#folha" class="pisca"/></svg></div>
  <div class="e" style="left:880px;top:1250px;animation-delay:.7s"><svg width="110" height="110" viewBox="0 0 120 120"><use href="#estrela" class="pisca"/></svg></div>
  <div class="cfs" style="left:480px;top:1200px"></div>
</div></div>

<div class="q" id="l2" data-dur="5.4"><div class="wrap">
  <div class="bloco" style="top:1130px"><span class="p roxo">Mãozinhas</span><div class="g" data-t="Na terra" style="font-size:196px"></div></div>
  <div class="e" style="left:24px;top:1050px;animation-delay:.3s"><svg width="130" height="120" viewBox="0 0 130 120"><use href="#folha" class="pisca"/></svg></div>
  <div class="e" style="left:860px;top:1080px;animation-delay:.6s"><svg width="120" height="120" viewBox="0 0 120 120"><use href="#estrela" class="pisca"/></svg></div>
  <div class="e" style="left:700px;top:1480px;animation-delay:.75s"><svg width="80" height="80" viewBox="0 0 120 120"><use href="#estrela" class="pisca"/></svg></div>
  <div class="cfs" style="left:480px;top:1320px"></div>
</div></div>

<div class="q" id="l3" data-dur="3.4"><div class="wrap">
  <div class="e" style="left:640px;top:1000px;animation-delay:.2s"><svg width="210" height="210" viewBox="0 0 200 200"><use href="#sol"/></svg></div>
  <div class="bloco" style="top:1130px"><span class="p ama">Todo mundo</span><div class="g" data-t="Junto" style="font-size:230px"></div></div>
  <div class="e" style="left:24px;top:1050px;animation-delay:.3s"><svg width="110" height="110" viewBox="0 0 120 120"><use href="#estrela" class="pisca"/></svg></div>
  <div class="e" style="left:810px;top:1420px;animation-delay:.7s"><svg width="120" height="110" viewBox="0 0 130 120"><use href="#folha" class="pisca"/></svg></div>
  <div class="cfs" style="left:440px;top:1320px"></div>
</div></div>

<div class="q" id="l4" data-dur="3.4"><div class="wrap">
  <div class="bloco" style="top:1130px"><span class="p tur">Plantando</span><div class="g" data-t="O futuro" style="font-size:186px"></div></div>
  <div class="e" style="left:24px;top:1050px;animation-delay:.3s"><svg width="130" height="120" viewBox="0 0 130 120"><use href="#folha" class="pisca"/></svg></div>
  <div class="e" style="left:800px;top:1090px;animation-delay:.6s"><svg width="120" height="120" viewBox="0 0 120 120"><use href="#estrela" class="pisca"/></svg></div>
  <div class="cfs" style="left:480px;top:1320px"></div>
</div></div>

<div class="q" id="l5" data-dur="2.3"><div class="wrap">
  <div class="e" style="left:720px;top:980px;animation-delay:.2s"><svg width="210" height="210" viewBox="0 0 200 200"><use href="#sol"/></svg></div>
  <div class="bloco" style="top:1130px"><span class="p roxo">Boa Espera</span><div class="g" data-t="Mais verde" style="font-size:158px"></div></div>
  <div class="e" style="left:24px;top:1050px;animation-delay:.3s"><svg width="130" height="120" viewBox="0 0 130 120"><use href="#folha" class="pisca"/></svg></div>
  <div class="e" style="left:880px;top:1440px;animation-delay:.6s"><svg width="100" height="100" viewBox="0 0 120 120"><use href="#estrela" class="pisca"/></svg></div>
  <div class="cfs" style="left:480px;top:1320px"></div>
</div></div>
<script>
const cores=['#FF4FA3','#FFD21E','#19C8E6','#7ED321','#FF8A1F','#B15CFF'];
document.querySelectorAll('.q').forEach((q,qi)=>{q.style.setProperty('--dur',q.dataset.dur);
  q.querySelectorAll('.g').forEach(g=>{let n=0;const letras=[...g.dataset.t].map(c=>c===' '?'<span class="esp"></span>':`<i style="--i:${n};--c:${cores[(n+++qi*2)%6]}"><b>${c}</b></i>`).join('');
    g.innerHTML=['c1','c2','c3'].map(k=>`<span class="${k}">${letras}</span>`).join('')});
  q.querySelectorAll('.cfs').forEach(c=>{c.style.position='absolute';let h='';
    for(let k=0;k<22;k++){const a=k/22*6.283+qi,r=330+((k*37)%170);h+=`<span class="cf" style="background:${cores[k%6]};--dx:${Math.round(Math.cos(a)*r*1.25)}px;--dy:${Math.round(Math.sin(a)*r-120)}px"></span>`}
    c.innerHTML=h})});
</script>
</body></html>
