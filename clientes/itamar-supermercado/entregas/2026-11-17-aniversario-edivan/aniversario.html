<!doctype html><meta charset="utf-8"><meta name="tamanho" content="1080x1920">
<link rel="stylesheet" href="../../../../ferramentas/fontes.css">
<!-- Camada animada (fundo transparente) do story de aniversário do Edivan.
     window.setT(segundos) posiciona a animação; render-video.js grava quadro a quadro e junta com o vídeo.
     Textos: editar o HTML abaixo. Tempos: constantes VID (fim do vídeo) e FIM (fim do story). -->
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:"Baloo 2",sans-serif}
#confete{position:absolute;inset:0}
.titulo{position:absolute;left:0;right:0;top:1230px;display:flex;flex-direction:column;align-items:center}
.selo{background:#FF291E;color:#280E01;font-weight:800;font-size:58px;line-height:1;padding:22px 40px 14px;border-radius:999px;
  box-shadow:0 8px 0 #280E01}
.nome{margin-top:-6px;background:#FFD302;color:#280E01;font-weight:800;font-size:150px;line-height:1;padding:26px 56px 6px;
  border-radius:40px;box-shadow:0 12px 0 #280E01;letter-spacing:.01em}
.sub{margin-top:30px;background:#280E01;color:#FFD302;font-weight:600;font-size:40px;padding:12px 32px 6px;border-radius:16px}
#cartao{position:absolute;inset:0;background:#FFD302;overflow:hidden}
#cartao .faixa{position:absolute;left:0;right:0;top:0;height:24px;background:#FF291E}
#cartao .faixa.b{top:auto;bottom:0}
.c-top{position:absolute;left:60px;right:60px;top:280px;text-align:center;color:#280E01}
.c-top .k{display:inline-block;background:#FF291E;color:#280E01;font-weight:800;font-size:54px;padding:16px 38px 8px;border-radius:999px}
.c-top h1{font-weight:800;font-size:132px;line-height:.95;margin-top:28px}
.c-top h1 span{display:inline-block;background:#FF291E;color:#280E01;padding:18px 40px 0;border-radius:32px;margin-top:14px;box-shadow:0 10px 0 #280E01}
.c-top p{font-weight:600;font-size:46px;line-height:1.2;margin-top:28px}
.espaco{position:absolute;left:150px;right:150px;top:1010px;height:300px;border:6px dashed rgba(40,14,1,.35);border-radius:40px;
  display:flex;align-items:center;justify-content:center;text-align:center;color:rgba(40,14,1,.55);font-weight:600;font-size:34px;line-height:1.2}
.seta{position:absolute;left:0;right:0;top:880px;text-align:center;font-size:110px;line-height:1}
.c-logo{position:absolute;left:0;right:0;top:1350px;display:flex;flex-direction:column;align-items:center}
.c-logo img{width:420px}
.c-logo div{font-weight:800;font-size:44px;color:#280E01;margin-top:-4px}
.emoji{font-family:"Noto Color Emoji",sans-serif}
</style>
<canvas id="confete" width="1080" height="1920"></canvas>
<div class="titulo" id="titulo">
  <div class="selo" id="selo">FELIZ ANIVERSÁRIO <span class="emoji">🎉</span></div>
  <div class="nome" id="nome">EDIVAN</div>
  <div class="sub" id="sub">da família Itamar Supermercado</div>
</div>
<div id="cartao">
  <div class="faixa"></div><div class="faixa b"></div>
  <div class="c-top">
    <div class="k" id="k">HOJE É DIA DE FESTA <span class="emoji">🎂</span></div>
    <h1 id="h1">PARABÉNS,<br><span>EDIVAN!</span></h1>
    <p id="p">Muita saúde, alegria e conquistas!<br>Deixe seu recado pra ele aqui embaixo</p>
  </div>
  <div class="seta emoji" id="seta">👇</div>
  <div class="espaco" id="espaco">espaço da figurinha<br>(adicionar no Instagram)</div>
  <div class="c-logo" id="logo"><img src="../../identidade/logo-itamar-3d-transparente.png" alt=""><div>@itamarsupermercado</div></div>
</div>
<script>
const VID = 5.14, FIM = 10.14;              // fim do vídeo e fim do story (cartão final = 5 s)
const MOSTRAR_GUIA = new URLSearchParams(location.search).has('guia'); // moldura tracejada só na prévia
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const pop = x => { x = cl(x); const c = 1.70158 * 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// confete determinístico (mesma posição para o mesmo t)
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const CORES = ['#FFD302', '#FF291E', '#FFFFFF', '#280E01', '#FF291E', '#FFD302'];
const P = [...Array(140)].map(() => ({ x: rnd() * 1080, v: 260 + rnd() * 380, d: rnd() * 3, w: 14 + rnd() * 16, h: 8 + rnd() * 10,
  r: rnd() * 6.28, vr: (rnd() - .5) * 8, a: 30 + rnd() * 50, f: .8 + rnd() * 1.6, c: CORES[Math.floor(rnd() * CORES.length)], ini: rnd() }));
const ctx = $('confete').getContext('2d');
function confete(t) {
  ctx.clearRect(0, 0, 1080, 1920);
  P.forEach((p, i) => {
    // duas rajadas: início do vídeo e início do cartão final
    const t0 = t < VID ? 0.15 : VID + 0.2, tt = t - t0 - p.d * 0.5;
    if (tt < 0) return;
    const y = -40 + tt * p.v + (t < VID ? -p.ini * 300 : -p.ini * 300);
    if (y > 1960) return;
    const x = p.x + Math.sin(tt * p.f + i) * p.a;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.r + tt * p.vr); ctx.scale(1, Math.cos(tt * p.f * 3 + i));
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  });
}
function entra(el, t, ini, dur = .45, de = 60) {
  const k = cl((t - ini) / dur); el.style.opacity = k > 0 ? 1 : 0;
  el.style.transform = `translateY(${(1 - ease(k)) * de}px) scale(${.6 + .4 * pop(k)})`;
}
window.setT = t => {
  confete(t);
  // vídeo: título entra e pulsa de leve
  const tit = $('titulo'); tit.style.display = t < VID + .6 ? 'flex' : 'none';
  entra($('selo'), t, .25); entra($('nome'), t, .45, .5, 80); entra($('sub'), t, .8);
  if (t > 1) $('nome').style.transform = `scale(${1 + .035 * Math.sin((t - 1) * 5)})`;
  // cartão final sobe por cima do último quadro
  const k = ease((t - VID) / .55); $('cartao').style.transform = `translateY(${(1 - k) * 1920}px)`;
  $('cartao').style.display = t >= VID ? 'block' : 'none';
  const c = t - VID;
  entra($('k'), c, .45); entra($('h1'), c, .65, .5, 80); entra($('p'), c, .95);
  entra($('logo'), c, 1.2);
  const ks = cl((c - 1.5) / .3); $('seta').style.opacity = ks;
  $('seta').style.transform = `translateY(${Math.abs(Math.sin(c * 5)) * 26}px)`;
  $('espaco').style.opacity = MOSTRAR_GUIA ? 1 : 0;
};
window.pronto = document.fonts.ready.then(() => new Promise(r => { const i = document.querySelector('img'); i.complete ? r() : i.onload = r; }));
</script>
